services:
  scheduler:
    build: .
    env_file:
      - .env
    volumes:
      - ./outputs:/app/outputs
      - ./logs:/app/logs

  api:
    build: .
    env_file:
      - .env
    volumes:
      - ./outputs:/app/outputs
    ports:
      - "8000:8000"
    command: ["uv", "run", "uvicorn", "app.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
