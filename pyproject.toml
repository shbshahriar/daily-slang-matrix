[project]
name = "daily-slang-matrix"
version = "0.1.0"
description = "Daily slang generator using LangGraph, Gemini, and RAG with PDF export"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "fastmcp>=2.3.4",
    "fpdf2>=2.8.7",
    "langchain>=1.3.1",
    "langchain-google-genai>=4.2.2",
    "langgraph>=1.2.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "uvicorn>=0.47.0",
]
